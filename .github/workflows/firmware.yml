name: Firmware
on:
  push:
    paths: ['Firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['Firmware/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test sensor calculations and display frames
        run: make -C Firmware test
      - name: Install Arm GNU Toolchain 14.3.Rel1
        run: |
          curl --fail --location --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -o /tmp/arm-gnu.tar.xz
          mkdir -p /tmp/arm-gnu
          tar -xJf /tmp/arm-gnu.tar.xz -C /tmp/arm-gnu --strip-components=1
          echo /tmp/arm-gnu/bin >> "$GITHUB_PATH"
      - name: Build STM32C562 firmware
        run: make -C Firmware -j4
      - uses: actions/upload-artifact@v4
        with:
          name: FluxDial
          path: |
            Firmware/build/FluxDial.elf
            Firmware/build/FluxDial.hex
            Firmware/build/FluxDial.bin
